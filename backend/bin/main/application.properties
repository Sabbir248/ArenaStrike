# Application identity and server settings
spring.application.name=arena-strike-backend
server.port=8080
spring.web.resources.static-locations=file:../frontend/,classpath:/static/

# MySQL connection.
# Override credentials with environment variables in production:
# DB_USERNAME, DB_PASSWORD, and DB_NAME.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:arenastrike}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# OAuth credentials. Set these to the same provider app/client IDs configured in the frontend.
google.client.id=${GOOGLE_CLIENT_ID:669840629062-homu57ddil3e8nj1eqlmniak356cgr0d.apps.googleusercontent.com}
facebook.app.id=${FACEBOOK_APP_ID:1640905734490306}
arenastrike.oauth.google-client-id=${google.client.id}
arenastrike.oauth.facebook-app-id=${facebook.app.id}
arenastrike.oauth.facebook-app-secret=${FACEBOOK_APP_SECRET:}
arenastrike.oauth.facebook-api-version=${FACEBOOK_API_VERSION:v26.0}

# Hibernate validates the schema created by Flyway; it never changes it at runtime.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Apply versioned database migrations on startup.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# STOMP broker endpoint settings are configured in WebSocketConfig.
spring.websocket.max-text-message-size=64KB
spring.websocket.max-binary-message-size=64KB
